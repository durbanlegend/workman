[package]
name = "workman-macros"
version.workspace = true
authors.workspace = true
description = "Procedural macros for the workman project"
repository.workspace = true
readme = "README.md"
license.workspace = true
edition.workspace = true

[lib]
# Keep the short name used throughout the code.
name = "macros"
proc-macro = true

[dependencies]
base16 = { package = "workman-base16", path = "../base16", version = "0.1.0" }
eframe = { workspace = true }
inline_colorization = "0.1"
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = { workspace = true }
syn = { workspace = true }
