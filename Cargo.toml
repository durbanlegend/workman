[package]
name = "workman_md"
version.workspace = true   # Inherits version 0.1.0 from the root
edition.workspace = true   # Inherits the Rust 2024 Edition
authors.workspace = true   # Inherits your author info
rust-version = "1.95"
description = "A fast, lightweight, multi-lingual GUI markdown viewer"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["markdown", "viewer", "gui", "egui"]
categories = ["command-line-utilities", "gui"]
# Keep the published package to what is needed to build, test and document it.
exclude = [
    ".github/",
    "dist-workspace.toml",
    "app.log",
    "assets/icon_orig.png",
    "assets/icon_left.png",
]

[workspace]
members = [
    "crates/base16",
    "crates/macros",
    ".",
]

[workspace.package]
edition = "2024" # Centralises edition 2024 so internal crates can inherit it
version = "0.1.0"
authors = ["Don Forbes <don.forbes3@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/durbanlegend/workman"

[workspace.dependencies]
# Define external crates used throughout your workspace here
eframe = { version = "0.37", features = ["wgpu"] }
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[package.metadata.i18n]
available-locales = ["af", "bg", "ca", "cs", "cy", "da", "de", "el", "en", "es", "fi", "fr", "hr", "hu", "it", "nb", "nl", "pl", "pt", "ro", "ru", "sk", "sl", "st", "sv", "uk", "xh", "zu"]
default-locale = "en"
load-path = "locales"

# The library keeps the short name used in `use workman::...`, and the binary is `workman`,
# whatever the package is called on crates.io.
[lib]
name = "workman"
path = "src/lib.rs"

[[bin]]
name = "workman"
path = "src/main.rs"

[dependencies]
base16 = { package = "workman_base16", path = "crates/base16", version = "0.1.0" }
chrono = "0.4"
dirs = "7"
eframe = { version = "0.37", features = ["wgpu"] }
ego-tree = "0.11.0"
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting", "svg", "fetch"] }
egui_extras = { version = "0.37", features = ["svg", "syntect"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdb = { version = "0.23", features = ["fs"] }
log = "0.4"
macros = { package = "workman_macros", path = "crates/macros", version = "0.1.0" }
notify = "8"
phf = { version = "0.14", features = ["macros"] }
pulldown-cmark = "0.13"
resvg = { version = "0.45", features = ["text"] }
rfd = "0.15"
rust-i18n = "4"
scraper = "0.27.0"
serde = "1"
# Pinned to ensure it won't pull a newer fancy-regex without us changing ours below:
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
sys-locale = "0.3"
thag_common = "1"
thiserror = "2"
toml = "1"
toml_edit = "0.25"

# EXPERIMENT (branch `html-opt-in`): build against the local fork, which has the
# `inline_html` feature. Cargo checks feature names even when they are not enabled,
# so this must stay while `native-inline-html` exists.
# DO NOT MERGE OR PUBLISH with this section: it needs ../egui_commonmark.
# [patch."https://github.com/lampsitter/egui_commonmark"]
# egui_commonmark = { path = "../egui_commonmark/egui_commonmark" }
# egui_commonmark_backend = { path = "../egui_commonmark/egui_commonmark_backend" }

# Keep dev builds fast enough to be usable for a GUI app.
[profile.dev]
opt-level = 3
debug = true

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
