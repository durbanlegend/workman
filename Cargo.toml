[package]
name = "workman"
version.workspace = true   # Inherits version 0.1.0 from the root
edition.workspace = true   # Inherits the Rust 2024 Edition
authors.workspace = true   # Inherits your author info
rust-version = "1.95"
description = "A fast, lightweight, multi-lingual GUI markdown viewer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/durbanlegend/workman"
readme = "README.md"
keywords = ["markdown", "viewer", "gui", "egui"]
categories = ["command-line-utilities", "gui"]

[workspace]
members = [
    "crates/base16",
    "crates/macros",
    ".",
]

[workspace.package]
edition = "2024" # Centralises edition 2024 so internal crates can inherit it
version = "0.1.0"
authors = ["Don Forbes <don.forbes3@gmail.com>"]

[workspace.dependencies]
# Define external crates used throughout your workspace here
eframe = { version = "0.36", features = ["wgpu"] }
quote = "1.0"
serde_yaml = "0.9"
syn = { version = "3.0", features = ["full"] }

[package.metadata.i18n]
available-locales = ["af", "bg", "ca", "cs", "cy", "da", "de", "el", "en", "es", "fi", "fr", "hr", "hu", "it", "nb", "nl", "no", "pl", "pt", "ro", "ru", "sk", "sl", "st", "sv", "uk", "xh", "zu"]
default-locale = "en"
load-path = "locales"

[[bin]]
name = "workman"
path = "src/main.rs"

[dependencies]
base16 = { path = "crates/base16" }
eframe = { version = "0.36", features = ["wgpu"] }
ego-tree = "0.11.0"
# NOTE: a git dependency prevents publishing to crates.io. Switch to a crates.io
# release of egui_commonmark once it contains the required changes.
egui_commonmark = { git = "https://github.com/lampsitter/egui_commonmark", features = ["better_syntax_highlighting", "svg", "fetch"] }
egui_extras = { version = "0.36", features = ["svg", "syntect"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdb = { version = "0.23", features = ["fs"] }
log = "0.4"
macros = { path = "crates/macros" }
notify = "8"
phf = { version = "0.14", features = ["macros"] }
pulldown-cmark = "0.13"
resvg = { version = "0.45", features = ["text"] }
rfd = "0.15"
rust-i18n = "4"
scraper = "0.27.0"
serde_yaml = "0.9"
sys-locale = "0.3"
thag_common = "1"

# Keep dev builds fast enough to be usable for a GUI app.
[profile.dev]
opt-level = 3
debug = true

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
