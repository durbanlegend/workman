[package]
name = "workman"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Don Forbes <don.forbes3@gmail.com>"]
description = "A fast, lightweight, multi-lingual GUI markdown viewer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/durbanlegend/workman"
readme = "README.md"
keywords = ["markdown", "viewer", "gui", "egui"]
categories = ["command-line-utilities", "gui"]

[package.metadata.i18n]
available-locales = ["af", "bg", "ca", "cs", "cy", "da", "de", "el", "en", "es", "fi", "fr", "hr", "hu", "it", "nb", "nl", "no", "pl", "pt", "ro", "ru", "sk", "sl", "st", "sv", "uk", "xh", "zu"]
default-locale = "en"
load-path = "locales"

[[bin]]
name = "workman"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["wgpu"] }
ego-tree = "0.11.0"
# NOTE: a git dependency prevents publishing to crates.io. Switch to a crates.io
# release of egui_commonmark once it contains the required changes.
egui_commonmark = { git = "https://github.com/lampsitter/egui_commonmark", features = ["better_syntax_highlighting", "svg", "fetch"] }
egui_extras = { version = "0.36", features = ["svg", "syntect"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.45", features = ["text"] }
fontdb = { version = "0.23", features = ["fs"] }
log = "0.4"
notify = "8"
pulldown-cmark = "0.13"
rfd = "0.15"
rust-i18n = "4"
scraper = "0.27.0"
sys-locale = "0.3"

[features]
# EXPERIMENT (branch `html-opt-in`): let egui_commonmark render inline html tags
# (<u>, <mark>, <sub>, <br>, ...) itself instead of rewriting them to Markdown in
# `html_prep`. Needs the local fork patched in below. Try it with:
#   cargo run --features native-inline-html -- README.md
native-inline-html = ["egui_commonmark/inline_html"]

# EXPERIMENT (branch `html-opt-in`): build against the local fork, which has the
# `inline_html` feature. Cargo checks feature names even when they are not enabled,
# so this must stay while `native-inline-html` exists.
# DO NOT MERGE OR PUBLISH with this section: it needs ../egui_commonmark.
[patch."https://github.com/lampsitter/egui_commonmark"]
egui_commonmark = { path = "../egui_commonmark/egui_commonmark" }
egui_commonmark_backend = { path = "../egui_commonmark/egui_commonmark_backend" }

# Keep dev builds fast enough to be usable for a GUI app.
[profile.dev]
opt-level = 3
debug = true

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
